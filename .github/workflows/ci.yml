# RJ-6.2: verificação automática de cada alteração (PR) e de cada push para main.
# Bloqueia: testes (npm test), compilação da app (vite build) e erros de tipos (tsc, RJ-6.1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 recente: corre os testes .ts sem dependências extra.
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes
        run: npm test

      - name: Compilar a app
        # O passo de migrações só corre em produção na Vercel (VERCEL_ENV=production);
        # aqui é ignorado, por isso a CI nunca toca na base de dados.
        run: npm run build

      - name: Erros de tipos (TypeScript)
        # RJ-6.1: com 0 erros, qualquer erro novo bloqueia a alteração.
        run: npm run typecheck
